name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

env:
    NODE_VERSION: 24.18.1
    NPM_VERSION: 12.0.2
    PUPPETEER_SKIP_DOWNLOAD: "true"

jobs:
    validate:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm

            - name: Align npm
              run: npm install --global "npm@${NPM_VERSION}"

            - name: Install locked dependencies
              run: npm ci --include=optional --strict-allow-scripts

            - name: Audit development and production dependencies
              run: |
                  npm run audit:all
                  npm run audit:prod
                  npm audit signatures

            - name: Verify Linux ARM64 native bindings
              run: npm run check:native-bindings

            - name: Validate source and unit behavior
              run: |
                  npm run lint
                  npm run typecheck
                  npm test
                  npm run build
                  npm run verify:deploy-assets

            - name: Accessibility smoke checks
              run: npm run a11y

            - name: Cypress browser tests
              run: npm run test:e2e
