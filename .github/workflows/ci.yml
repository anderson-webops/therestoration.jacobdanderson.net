name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

env:
    NODE_VERSION: 24.18.1
    NPM_VERSION: 12.0.2

jobs:
    validate:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm

            - name: Align npm
              run: npm install --global "npm@${NPM_VERSION}"

            - name: Install locked dependencies
              run: npm ci

            - name: Audit development and production dependencies
              run: |
                  npm run audit:all
                  npm run audit:prod

            - name: Verify Linux ARM64 native bindings
              run: npm run check:native-bindings

            - name: Validate source and unit behavior
              run: |
                  npm run lint
                  npm run typecheck
                  npm test
                  npm run build

            - name: Accessibility smoke checks
              run: npm run a11y

            - name: Cypress browser tests
              run: npm run test:e2e
