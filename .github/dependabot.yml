version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 10
    versioning-strategy: increase
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development
    ignore:
      # Keep editor/compiler types aligned with the Node 24 LTS and
      # TypeScript 6 production toolchain until those baselines move.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      # Deploy-target optional packages must exactly match the parent loader.
      # Update them through each repository's native-lock verification flow.
      - dependency-name: "@esbuild/linux-*"
      - dependency-name: "@img/sharp-*linux*"
      - dependency-name: "@napi-rs/*-linux*"
      - dependency-name: "@next/swc-linux-*"
      - dependency-name: "@oxc-parser/binding-linux-*"
      - dependency-name: "@oxc-resolver/binding-linux-*"
      - dependency-name: "@oxfmt/binding-linux-*"
      - dependency-name: "@rolldown/binding-linux-*"
      - dependency-name: "@rollup/rollup-linux-*"
      - dependency-name: "@unrs/resolver-binding-linux-*"
      - dependency-name: "lightningcss-linux-*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: America/New_York
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
