# Replace the host's old static `location /` block with this include. The Node
# service owns static files, API routes, release identity, and security headers.
location / {
	proxy_pass http://127.0.0.1:3007;
	proxy_http_version 1.1;
	proxy_set_header Connection "";
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $remote_addr;
	proxy_set_header X-Forwarded-Host $host;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_connect_timeout 5s;
	proxy_read_timeout 35s;
	proxy_send_timeout 35s;
	proxy_intercept_errors off;
	client_max_body_size 20k;

	# Defining a location-level add_header prevents inherited generic host
	# headers from replacing the application-owned policy. Empty values are not
	# emitted by Nginx; all actual security headers come from the Node service.
	add_header X-Restoration-Upstream-Policy "";
}
