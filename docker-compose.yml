services:
    restoration:
        image: ghcr.io/anderson-webops/therestoration.jacobdanderson.net:4.0.0
        build:
            context: .
            args:
                VCS_REF: ${VCS_REF:-local}
        init: true
        restart: unless-stopped
        env_file:
            - .env
        environment:
            HOST: 0.0.0.0
            NODE_ENV: production
            PORT: 3007
            STATIC_ROOT: /app/front-end/dist
            TRUST_PROXY_HOPS: 1
        ports:
            - "127.0.0.1:3007:3007"
        read_only: true
        tmpfs:
            - /tmp:size=16m,mode=1777
        cap_drop:
            - ALL
        security_opt:
            - no-new-privileges:true
        healthcheck:
            test:
                - CMD
                - node
                - -e
                - "fetch('http://127.0.0.1:3007/readyz').then(response => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));"
            interval: 30s
            timeout: 5s
            start_period: 10s
            retries: 3
        stop_grace_period: 15s
