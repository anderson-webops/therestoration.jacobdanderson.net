version = 1
name = "therestoration.jacobdanderson.net"

[setup]
script = """
node scripts/build-toolchain.mjs --install -- npm ci --prefix build-toolchain/compat --workspaces=false --ignore-scripts
"""

[[actions]]
name = "Install"
icon = "tool"
command = "node scripts/build-toolchain.mjs --install -- npm ci --prefix build-toolchain/compat --workspaces=false --ignore-scripts"

[[actions]]
name = "Build"
icon = "run"
command = "node scripts/build-toolchain.mjs -- npm run build"

[[actions]]
name = "Typecheck"
icon = "test"
command = "node scripts/build-toolchain.mjs -- npm run typecheck"

[[actions]]
name = "Lint"
icon = "test"
command = "node scripts/build-toolchain.mjs -- npm run lint"

[[actions]]
name = "Frontend Dev"
icon = "debug"
command = "node scripts/build-toolchain.mjs -- npm run dev"

[[actions]]
name = "Backend Dev"
icon = "debug"
command = "node scripts/build-toolchain.mjs -- npm run server"
